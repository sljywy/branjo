<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTIFAB">
    <meta name="theme-color" content="#0b1220">
    <title>GTIFAB Box</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:'#f5c400'}}}}</script>
    <style>
        body { background:#0b1220; }
        .card { background:#111827; border:1px solid #1f2937; }
    </style>
</head>
<body class="text-white min-h-screen pb-10">
    
    <div id="lock" class="fixed inset-0 z-50 bg-[#0b1220] flex items-center justify-center p-6">
        <div class="w-full max-w-xs text-center">
            <div class="text-primary font-bold tracking-widest text-xs mb-2">GTIFAB BOX</div>
            <h2 class="text-2xl font-bold mb-4">PIN</h2>
            <input id="pin" type="password" inputmode="numeric" maxlength="8"
                class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-center text-2xl tracking-widest">
            <button id="pinBtn" class="mt-4 w-full bg-primary text-black font-bold rounded-xl py-3">Otvoriť</button>
            <p id="pinErr" class="hidden mt-3 text-red-400 text-sm">Nesprávny PIN</p>
        </div>
    </div>

    <header class="sticky top-0 z-20 bg-[#0b1220]/95 border-b border-gray-800 px-4 py-3">
        <div class="text-primary font-bold tracking-widest text-xs">GTIFAB BOX</div>
        <h1 class="text-xl font-bold">Chip lookup</h1>
        <input id="q" type="search" placeholder="Audi A6 2.0 TDI..."
            class="mt-3 w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white">
    </header>

    <main class="px-4 pt-4">
        <div id="hits" class="space-y-2"></div>
        <div id="detail" class="hidden mt-4 card rounded-2xl p-4"></div>
    </main>

    <script src="vehicles.js"></script>
    <script>
        const hitsEl = document.getElementById('hits');
        const detailEl = document.getElementById('detail');
        const index = [];
        Object.keys(vehicleData || {}).forEach(make => {
            Object.keys(vehicleData[make]).forEach(model => {
                Object.keys(vehicleData[make][model]).forEach(engine => {
                    index.push({
                        make, model, engine,
                        data: vehicleData[make][model][engine],
                        text: (make + ' ' + model + ' ' + engine).toLowerCase()
                    });
                });
            });
        });

        function showHits(q) {
            hitsEl.innerHTML = '';
            detailEl.classList.add('hidden');
            if (!q || q.length < 2) return;
            const s = q.toLowerCase();
            index.filter(x => x.text.includes(s)).slice(0, 40).forEach((item, i) => {
                const b = document.createElement('button');
                b.className = 'w-full text-left card rounded-xl p-3';
                b.innerHTML = '<div class="font-semibold">' + item.make + ' ' + item.model + '</div>' +
                    '<div class="text-sm text-gray-400">' + item.engine + ' · ' + (item.data.origHP||'?') + ' → ' + (item.data.tunedHP||'?') + ' KS</div>';
                b.onclick = () => showDetail(item);
                hitsEl.appendChild(b);
            });
        }

        function row(k, v) {
            if (!v) return '';
            return '<div class="flex justify-between gap-3 py-1 border-b border-gray-800 text-sm"><span class="text-gray-500">' + k + '</span><span class="text-right">' + v + '</span></div>';
        }

        function showDetail(item) {
            const d = item.data;
            hitsEl.innerHTML = '';
            detailEl.classList.remove('hidden');
            detailEl.innerHTML =
                '<div class="text-primary text-sm">' + item.make + '</div>' +
                '<div class="text-xl font-bold">' + item.model + '</div>' +
                '<div class="text-gray-400 mb-4">' + item.engine + '</div>' +
                '<div class="grid grid-cols-2 gap-3 mb-4">' +
                '<div class="bg-gray-900 rounded-xl p-3"><div class="text-xs text-gray-500">Original</div><div class="text-2xl font-bold">' + (d.origHP||'—') + ' KS</div><div class="text-gray-400">' + (d.origNM||'—') + ' Nm</div></div>' +
                '<div class="bg-gray-900 rounded-xl p-3"><div class="text-xs text-primary">Stage 1</div><div class="text-2xl font-bold text-primary">' + (d.tunedHP||'—') + ' KS</div><div class="text-primary">' + (d.tunedNM||'—') + ' Nm</div></div>' +
                '</div>' +
                row('Palivo', d.fuel) + row('Typ', d.type) + row('Objem', d.cc) +
                row('Kompresia', d.comp) + row('Bore x stroke', d.bore) +
                row('Engine', d.enum) + row('ECU', d.ecu) + row('TCU', d.gecu) +
                (d.tools && d.tools.length ? '<div class="mt-3 text-sm text-gray-300">' + d.tools.join(' · ') + '</div>' : '') +
                (d.opts && d.opts.length ? '<div class="mt-2 text-sm text-primary">' + d.opts.join(' · ') + '</div>' : '') +
                '<button id="back" class="mt-4 w-full bg-primary text-black font-bold rounded-xl py-3">Späť</button>';
            document.getElementById('back').onclick = () => showHits(document.getElementById('q').value);
        }

        
        const PIN = '4323';
        const lock = document.getElementById('lock');
        if (sessionStorage.getItem('gtifab-box') === 'ok') lock.classList.add('hidden');
        function tryPin() {
            if (document.getElementById('pin').value === PIN) {
                sessionStorage.setItem('gtifab-box', 'ok');
                lock.classList.add('hidden');
            } else {
                document.getElementById('pinErr').classList.remove('hidden');
            }
        }
        document.getElementById('pinBtn').addEventListener('click', tryPin);
        document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(); });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        document.getElementById('q').addEventListener('input', e => showHits(e.target.value));
    </script>
</body>
</html>
